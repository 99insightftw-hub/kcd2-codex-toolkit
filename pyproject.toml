[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kcd2-codex-toolkit"
version = "0.1.0"
description = "Evidence-first KCD2 tooling for Codex"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "99insightftw-hub"}]
dependencies = ["PyYAML>=6.0"]

[tool.setuptools]
package-dir = {"" = "runtime/src"}

[tool.setuptools.packages.find]
where = ["runtime/src"]
